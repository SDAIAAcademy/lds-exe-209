<h2>اليوم 1: حادثة واحدة من أولها إلى مذكرتها</h2>
<ol>
<li><p>في جهة افتراضية أخرى أرسل وكيل الجدولة دعوات اجتماع إلى عنوان خارجي. الأثر يُظهر استدعاء send_invite بأربعين مستلمًا، وسجل البوابة يقول «delivered». المورد يقول: «لم تنكشف بيانات». أي عبارة تكتبها في خانة «مؤكد»؟</p><ul><li><b>أ.</b> لم تنكشف أي بيانات حساسة، كما أكد المورد في رده</li><li><b>ب.</b> سُلّمت أربعون دعوة إلى العنوان الخارجي</li><li><b>ج.</b> فتح المستلم الدعوات واطلع عليها</li><li><b>د.</b> المهاجم استهدف الجهة عمدًا</li></ul></li>
<li><p>في جهة صحية افتراضية أخذ مساعد التذكير بالأدوية يعطي جرعات مضاعفة لدواء واحد منذ أمس. المزوّد سحب الإصدار السابق ولا يمكن الرجوع إليه، ولا يُعرف أي الأسئلة تؤدي إلى الخطأ. الصيادلة يستطيعون الرد على نحو 500 محادثة يوميًا تمر به. ما الاحتواء الآن؟</p><ul><li><b>أ.</b> التراجع إلى الإصدار السابق الأسلم</li><li><b>ب.</b> إضافة تحذير واضح تحت كل رد عن الأدوية يطلب استشارة صيدلي</li><li><b>ج.</b> حجب الأسئلة عن هذا الدواء وحده</li><li><b>د.</b> إيقاف المساعد وتحويل محادثاته إلى الصيادلة</li></ul></li>
<li><p>في جهة افتراضية أخرى أرسل وكيل الموارد البشرية ملف رواتب إلى عنوان خارجي قبل ساعة، ولم يرسل شيئًا بعده. فريق المنصة يقترح مسح ذاكرة الوكيل وإعادة تشغيله لينتهي الأمر بسرعة. الآثار تُحفظ سبعة أيام. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> أخذ نسخة من الذاكرة والآثار والبريد، ثم تعطيل أداة الإرسال</li><li><b>ب.</b> مسح الذاكرة وإعادة التشغيل كما اقترح فريق المنصة</li><li><b>ج.</b> انتظار فريق تحقيق جنائي خارجي قبل أي خطوة، حتى لا يُفسد الدليل</li><li><b>د.</b> تغيير كلمات مرور حسابات الموظفين</li></ul></li>
<li><p>شركة افتراضية هي جهة التحكم علمت في الساعة 10 أن ملفًا فيه بيانات عملاء كُشف لطرف خارجي، ومن شأن ذلك الإضرار بهم. في الساعة 60 ما زال عدد العملاء غير معروف بدقة: بين 3,000 و5,000. ماذا تفعل قبل الساعة 82؟</p><ul><li><b>أ.</b> تنتظر العدد الدقيق، فالمهلة تبدأ حين يكتمل التحقيق</li><li><b>ب.</b> تُشعر العملاء وحدهم الآن بلغة مبسطة، فهم المتضررون ولا يلزم غيرهم</li><li><b>ج.</b> تُشعر الجهة المختصة الآن بعدد تقريبي، وتقدّم الباقي لاحقًا مع مبررات التأخير</li><li><b>د.</b> تطلب من الطرف الخارجي الذي كُشفت له البيانات أن يُشعر هو الجهة المختصة</li></ul></li>
<li><p>جهة مرور افتراضية أصدر نموذجها مخالفات خاطئة لنحو ألفي سائق خلال أسبوع. أوقفت الإصدار الآلي، ولم يتضح بعد هل الخلل في النموذج أم في بيانات الكاميرات. أي سطر يدخل البيان المقتضب للجمهور؟</p><ul><li><b>أ.</b> الخلل في نموذج المورد وليس في أنظمة الجهة</li><li><b>ب.</b> أوقفنا الإصدار الآلي، ولمن خولف هذا الأسبوع طلب المراجعة</li><li><b>ج.</b> لم يتضرر أي سائق من هذه المخالفات</li><li><b>د.</b> انتقل النموذج إلى إصدار جديد من المورد قبل أسبوع من ظهور الخلل</li></ul></li>
<li><p>في جهة افتراضية أخرى يقول سجل المخاطر إن مشرفًا يراجع كل أسبوع عينة من قرارات نموذج لفرز الطلبات. أي دليل يثبت أن هذا الضابط عمل في الشهرين الماضيين؟</p><ul><li><b>أ.</b> سياسة الفرز المعتمدة التي تنص على المراجعة الأسبوعية للقرارات</li><li><b>ب.</b> الوصف الوظيفي للمشرف وفيه المراجعة الأسبوعية</li><li><b>ج.</b> شهادة من مورد النموذج بأن نموذجه دقيق</li><li><b>د.</b> سجل العينات ثمانية أسابيع، بأسماء المراجعين ونتائجهم</li></ul></li>
<li><p>في إجراء حوادث لجهة افتراضية: مالك النظام يطلب الاستئناف، والقائد الفني يعيد الاختبار، وطرف مستقل يتحقق، والتنفيذي المسؤول يعتمد. أُوقف مساعد الحجز في حادثة عالية الشدة، ونجحت إعادة الاختبار. من يعتمد الاستئناف؟</p><ul><li><b>أ.</b> مالك المساعد، فهو أعرف بخدمته وهو من طلب الاستئناف أصلًا</li><li><b>ب.</b> القائد الفني، فقد أجرى الاختبار بنفسه</li><li><b>ج.</b> التنفيذي المسؤول، بعد تحقق الطرف المستقل من النتائج</li><li><b>د.</b> المزوّد، فالنموذج نموذجه</li></ul></li>
<li><p>إجراء شركة افتراضية: الحادثة الحرجة تُرفع إلى التنفيذي المسؤول خلال ساعتين من التصنيف، وإلى رئيس المجلس خلال 48 ساعة من التصنيف. وقعت الحادثة في الساعة 0، وصُنفت حرجة في الساعة 5. متى يجب أن يعلم رئيس المجلس على الأكثر؟</p><ul><li><b>أ.</b> الساعة 48، من وقوع الحادثة</li><li><b>ب.</b> الساعة 7</li><li><b>ج.</b> الساعة 53</li><li><b>د.</b> حين تكتمل الحقائق</li></ul></li>
<li><p>إذا نجحت إعادة الاختبار، يجوز لمالك النظام أن يعتمد استئناف نظامه الذي أوقف في حادثة عالية الشدة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وكيل في جهة افتراضية ما زال يرسل ملفات إلى عنوان خارجي كل بضع دقائق. التنفيذي المسؤول في رحلة ولا يرد. الإجراء يعطي قائد الحادثة الإيقاف الطارئ في الحوادث العالية والحرجة. ماذا يفعل قائد الحادثة؟</p><ul><li><b>أ.</b> ينتظر التنفيذي المسؤول ليقرر بنفسه حين يعود من رحلته</li><li><b>ب.</b> يأمر بالإيقاف الآن، ثم يُبلغ المسؤولين خلال ساعة</li><li><b>ج.</b> يطلب من مالك الوكيل أن يقرر الإيقاف</li><li><b>د.</b> يطلب من المزوّد أن يوقف النموذج من جهته فورًا</li></ul></li>
<li><p>وكيل في جهة افتراضية نفذ أمرًا لا يظهر في نص الرسالة كما يعرضها برنامج البريد. أي مصدر يثبت ما دخل إلى النموذج فعلًا؟</p><ul><li><b>أ.</b> نص الرسالة كما يعرضه برنامج البريد</li><li><b>ب.</b> رسالة الوكيل الختامية عما فعله</li><li><b>ج.</b> ما يتذكره الموظف الذي فتح الرسالة</li><li><b>د.</b> مدخل النموذج المحفوظ في الأثر</li></ul></li>
<li><p>الرسالة الختامية لوكيل تقول: «رددت بالملخص المطلوب». والأثر يُظهر استدعاء إرسال بريد بمرفق اسمه export.csv، ونتيجته «أُرسل». ما المؤكد؟</p><ul><li><b>أ.</b> أُرسل مرفق اسمه export.csv</li><li><b>ب.</b> أُرسل ملخص فقط كما قال الوكيل</li><li><b>ج.</b> لم يُرسل شيء، فالوكيل لم يذكر مرفقًا</li><li><b>د.</b> فتح المستلم الملف</li></ul></li>
<li><p>إذا قال سجل بوابة البريد إن الرسالة «سُلّمت»، فقد قرأها المستلم.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>فريق في جهة افتراضية عدّ 12 ردًّا خاطئًا من مساعده بجمع لقطات الشاشة في وسائل التواصل. كيف يعرف العدد الحقيقي؟</p><ul><li><b>أ.</b> يعتمد العدد 12، فهو ما انتشر</li><li><b>ب.</b> يسأل المزوّد كم ردًّا خاطئًا أعطى النموذج</li><li><b>ج.</b> يبحث في الآثار عن كل رد بالنمط نفسه</li><li><b>د.</b> يطلب من الجمهور الإبلاغ عن كل رد خاطئ</li></ul></li>
<li><p>مصفوفة جهة افتراضية: «حرجة» إذا غادرت الجهة بيانات شخصية حساسة لأي عدد أو بيانات شخصية لأكثر من 200 شخص؛ و«عالية» لبيانات غير حساسة لـ200 شخص أو أقل. خرج ملف فيه أسماء 40 مراجعًا وتشخيصاتهم. ما المستوى؟</p><ul><li><b>أ.</b> عالية، فالعدد أقل من 200</li><li><b>ب.</b> حرجة، والعدد لا يغيّر ذلك</li><li><b>ج.</b> متوسطة، فلم يثبت ضرر بعد</li><li><b>د.</b> لا تصنيف قبل معرفة المستلم</li></ul></li>
<li><p>عقد شركة افتراضية مع مورد ينص على أن يُشعر كل طرف الآخر خلال 24 ساعة من اشتباهه في انتحال هويته. ما نوع هذه المهلة في جدول الإشعارات؟</p><ul><li><b>أ.</b> نظامية</li><li><b>ب.</b> تنظيمية</li><li><b>ج.</b> داخلية</li><li><b>د.</b> تعاقدية</li></ul></li>
<li><p>تجيز اللائحة التنفيذية لنظام حماية البيانات الشخصية لجهة التحكم التي لم تتمكن من تقديم بعض المعلومات خلال 72 ساعة أن تقدمها في أقرب وقت ممكن مع مبررات التأخير.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>تسربت بيانات عملاء شركة افتراضية من نظام مورد يعالجها لحسابها. من يُشعر الجهة المختصة؟</p><ul><li><b>أ.</b> المورد وحده، فالتسرب في نظامه</li><li><b>ب.</b> الشركة، جهة التحكم، بالتنسيق مع المورد</li><li><b>ج.</b> لا أحد حتى يثبت أن أحدًا استعمل البيانات المسربة</li><li><b>د.</b> العملاء أنفسهم</li></ul></li>
<li><p>جهة حكومية افتراضية تعد جدول إشعاراتها لحادثة أمن سيبراني. ماذا تكتب في نوع مهلة الهيئة الوطنية للأمن السيبراني إذا اعتمدت على نص الضوابط الأساسية وحده؟</p><ul><li><b>أ.</b> نظامية: 72 ساعة من العلم، كمهلة نظام حماية البيانات</li><li><b>ب.</b> داخلية: لا إبلاغ إلا بقرار الجهة</li><li><b>ج.</b> تنظيمية: بحسب ما تحدده الهيئة، فالنص لا يذكر ساعات</li><li><b>د.</b> تعاقدية: بحسب عقد مزوّد الخدمة</li></ul></li>
<li><p>أي سطر في سجل قرارات فريق افتراضي مكتمل؟</p><ul><li><b>أ.</b> أوقفنا الوكيل</li><li><b>ب.</b> الساعة 14: قرر الفريق إيقاف الوكيل لأنه خطر</li><li><b>ج.</b> الساعة 14: قائدة الحادثة أوقفت الوكيل؛ مبررها إرسال جارٍ إلى نطاق مجهول؛ المعروف: رسالتان، والعدد غير مؤكد</li><li><b>د.</b> قائدة الحادثة: إيقاف الوكيل كما اتفقنا</li></ul></li>
<li><p>عضو في مجلس إدارة جهة افتراضية يطلب انتظار اكتمال الحقائق قبل إشعار الجهة المختصة، والمهلة تنتهي بعد عشر ساعات. ماذا يكتب الفريق في السجل؟</p><ul><li><b>أ.</b> تأجيل الإشعار حتى تكتمل الحقائق، احترامًا لطلب عضو المجلس وتجنبًا لتصحيحه لاحقًا</li><li><b>ب.</b> الإشعار بما هو معروف قبل نهاية المهلة، وما ينقص لاحقًا مع مبررات التأخير</li><li><b>ج.</b> إشعار أصحاب البيانات بدل الجهة المختصة</li><li><b>د.</b> طلب تمديد المهلة من المجلس</li></ul></li>
<li><p>جهة افتراضية أوقفت مساعدها بعد ردود خاطئة عن مواعيد تجديد الرخص. أي سطر يدخل نص موظفي مركز الاتصال؟</p><ul><li><b>أ.</b> توقف المساعد مؤقتًا، ونساعدك هاتفيًا ونعيد حجز موعدك</li><li><b>ب.</b> السبب خطأ في نموذج المورد</li><li><b>ج.</b> لم يتأثر أحد بهذه الردود</li><li><b>د.</b> المساعد يعمل منذ أسبوع على إصدار جديد من النموذج غيّر سلوكه</li></ul></li>
<li><p>يُقدَّم الإيقاف على حفظ الأدلة حين يكون التأخير سببًا في استمرار الضرر؛ وفي غير ذلك تُحفظ الأدلة قبل أي تغيير.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>بعد حادثة في جهة افتراضية أرسل فيها وكيل ملفًا إلى الخارج، أي عبارة سبب جذري؟</p><ul><li><b>أ.</b> أرسل الوكيل الملف إلى عنوان خارجي بعد أن قرأ الرسالة المحقونة</li><li><b>ب.</b> المهاجم كان ماهرًا</li><li><b>ج.</b> حساب الوكيل أُنشئ بصلاحيات مدير النظام ولم تُراجع بعد الإطلاق</li><li><b>د.</b> النموذج الذي يعمل خلف الوكيل غير آمن بما يكفي</li></ul></li>
<li><p>أي إجراء يستوفي معيار المذكرة: مربوط بسبب، وله مسؤول وموعد ودليل تنفيذ؟</p><ul><li><b>أ.</b> تحسين الإشراف على أنظمة الذكاء الاصطناعي في الجهة كلها</li><li><b>ب.</b> تدريب كل الموظفين على التعامل مع الحوادث</li><li><b>ج.</b> مطالبة المزوّد بإصلاح النموذج قبل أي استئناف</li><li><b>د.</b> مراجعة فصلية لصلاحيات الوكلاء، يملكها مدير الهوية، تبدأ خلال 60 يومًا، ودليلها تقرير موقَّع</li></ul></li>
<li><p>سجل أنظمة جهة افتراضية يقول إن مساعدها يعمل على إصدار قديم، وإن وكيلها يقرأ بيانات «عامة»، والآثار تقول غير ذلك. ما التحديث؟</p><ul><li><b>أ.</b> الإصدار الفعلي، وتصنيف ما يقرؤه الوكيل، ومالك الإيقاف باسمه</li><li><b>ب.</b> لا تحديث للسجل حتى موعد المراجعة السنوية المجدولة للأنظمة كلها</li><li><b>ج.</b> حذف الوكيل من السجل لأنه موقوف</li><li><b>د.</b> إضافة ملاحظة «قيد المراجعة»</li></ul></li>
<li><p>إعادة اختبار تنجح على الحالات التي أخفقت تثبت أن النظام آمن للاستئناف الكامل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مراجعة ما بعد الحادثة تسأل ما الذي جعل الخطأ سهلًا، قبل أن تسأل من أخطأ.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
